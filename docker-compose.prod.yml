# BalanceVault production stack for a single server (e.g. Oracle Cloud Always Free VM).
#
# Folder layout on the server (both repositories side by side):
#   ~/balancevault/Backend    <- this repo (contains this file, Caddyfile and .env)
#   ~/balancevault/Frontend   <- frontend repo
#
# Start / update (from the Backend folder):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). It gets a free HTTPS certificate
# for $DOMAIN automatically and routes /api, /health, /ready -> backend, everything else -> frontend.
# PostgreSQL, Redis and the backend are NOT published to the internet.

name: balancevault-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-balancevault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-balancevault}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Browser, API and reset links all use the one public HTTPS address.
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      FRONTEND_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      # Trust X-Forwarded-For from Caddy so rate limits see each visitor's real IP.
      # Safe because the backend is only reachable through Caddy on the internal network.
      FORWARDED_ALLOW_IPS: "*"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BalanceVault <no-reply@example.com>}
      BV_ADMIN_USERNAME: ${BV_ADMIN_USERNAME:-admin}
      BV_ADMIN_EMAIL: ${BV_ADMIN_EMAIL:-admin@example.com}
      BV_ADMIN_NAME: ${BV_ADMIN_NAME:-Vault Admin}
      BV_ADMIN_PASSWORD: ${BV_ADMIN_PASSWORD:-}
    networks: [internal]

  frontend:
    build:
      context: ../Frontend
      args:
        # Empty = the app calls /api on its own address; Caddy forwards it to the backend.
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
